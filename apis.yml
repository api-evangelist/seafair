name: Seafair
description: >-
  Seafair is an AI-native ERP platform for maritime operations, unifying crew
  management, HSQE and regulatory compliance, technical maintenance (planned
  maintenance systems and defect tracking), and accounting into a single system
  for shipping companies and ship managers. Its AI compliance engine performs
  document search and framework reviews (such as DryBMS and TMSA) and embeds AI
  assistance directly into operational workflows. Seafair markets itself as
  API-first with fast ERP integrations, but does not currently publish a public
  developer portal, API reference, SDKs, or OpenAPI definition. Seafair is a
  portfolio company of Speedinvest and is tracked in the API Evangelist network.
